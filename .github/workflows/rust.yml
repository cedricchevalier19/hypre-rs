name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      HYPRE_LIB_DIR: "/usr/lib/x86_64-linux-gnu/"
      HYPRE_INCLUDE_DIR: "/usr/include/hypre/"

    steps:
      - name: Setup hypre
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libhypre-dev libopenmpi-dev openmpi-bin
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check
        run: cargo check --all-features
      - uses: clechasseur/rs-clippy-check@v3
        with:
          args: --all-features --no-deps
      - name: Test
        run: cargo test --all-features
      # Cargo's target runner wraps test binaries, doctests and examples.
      # 3 ranks checks a row count that does not divide evenly.
      - name: Test on several MPI ranks
        run: |
          for n in 2 3; do
            echo "::group::mpirun -n $n"
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="mpirun -n $n"
            cargo test --all-features
            cargo run --example simple-cg
            echo "::endgroup::"
          done
