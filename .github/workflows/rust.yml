name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Weekly rebuild of the CI image to pick up new stable Rust and Debian fixes.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds the `ci` stage of .devcontainer/Dockerfile and pushes it to GHCR,
  # tagged by the Dockerfile's hash. When that tag already exists the build is
  # skipped, so most runs only pull a ready image instead of running apt-get.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image reference
        id: ref
        run: |
          repo="$(echo "ghcr.io/${GITHUB_REPOSITORY}-ci" | tr '[:upper:]' '[:lower:]')"
          tag="${{ hashFiles('.devcontainer/Dockerfile') }}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${tag:0:16}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the image already exists
        id: exists
        run: |
          if [ "${{ github.event_name }}" != schedule ] \
             && [ "${{ github.event_name }}" != workflow_dispatch ] \
             && docker buildx imagetools inspect "${{ steps.ref.outputs.image }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: .devcontainer
          target: ci
          pull: true
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

  build:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write # rs-clippy-check annotations
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # OpenMPI's shared-memory transport needs more than Docker's 64 MB default.
      options: --shm-size=1g
    # HYPRE_LIB_DIR, HYPRE_INCLUDE_DIR, the toolchain, clippy and MPI all come
    # from the image.

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-features
      - uses: clechasseur/rs-clippy-check@v3
        with:
          args: --all-features --no-deps
      - name: Test
        run: cargo test --all-features
      # Cargo's target runner wraps test binaries, doctests and examples.
      # 3 ranks checks a row count that does not divide evenly. GitHub runners
      # have fewer cores than that, so let OpenMPI oversubscribe.
      - name: Test on several MPI ranks
        run: |
          for n in 2 3; do
            echo "::group::mpirun -n $n"
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="mpirun --oversubscribe -n $n"
            cargo test --all-features
            cargo run --example simple-cg
            echo "::endgroup::"
          done
