name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Weekly rebuild of the CI image to pick up new stable Rust and Debian fixes.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs (the release is in the trailing comment),
# so a moved or compromised tag cannot change what CI runs.
jobs:
  # Builds the `ci` stage of .devcontainer/Dockerfile and pushes it to GHCR,
  # tagged by the Dockerfile's hash. When that tag already exists the build is
  # skipped, so most runs only pull a ready image instead of running apt-get.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image reference
        id: ref
        run: |
          repo="$(echo "ghcr.io/${GITHUB_REPOSITORY}-ci" | tr '[:upper:]' '[:lower:]')"
          tag="${{ hashFiles('.devcontainer/Dockerfile') }}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${tag:0:16}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the image already exists
        id: exists
        run: |
          if [ "${{ github.event_name }}" != schedule ] \
             && [ "${{ github.event_name }}" != workflow_dispatch ] \
             && docker buildx imagetools inspect "${{ steps.ref.outputs.image }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.found != 'true'
        with:
          context: .devcontainer
          target: ci
          pull: true
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

  build:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write # rs-clippy-check annotations
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # OpenMPI's shared-memory transport needs more than Docker's 64 MB default.
      options: --shm-size=1g
    # HYPRE_LIB_DIR, HYPRE_INCLUDE_DIR, the toolchain, clippy and MPI all come
    # from the image.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check
        run: cargo check --all-features
      - uses: clechasseur/rs-clippy-check@1f566b8b39778a3778838ac8350a1c1effd7b91c # v6.1.2
        with:
          args: --all-features --no-deps
      - name: Test
        run: cargo test --all-features
      # Each example checks its own result and fails otherwise.
      - name: Run examples
        run: |
          for example in examples/*.rs; do
            cargo run --example "$(basename "$example" .rs)"
          done
      # Cargo's target runner wraps test binaries, doctests and examples.
      # 3 ranks checks a row count that does not divide evenly. GitHub runners
      # have fewer cores than that, so let OpenMPI oversubscribe.
      - name: Test on several MPI ranks
        run: |
          for n in 2 3; do
            echo "::group::mpirun -n $n"
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="mpirun --oversubscribe -n $n"
            cargo test --all-features
            for example in examples/*.rs; do
              cargo run --example "$(basename "$example" .rs)"
            done
            echo "::endgroup::"
          done

  # Builds the API documentation of hypre-rs; warnings such as broken
  # intra-doc links fail the job. The HTML is attached to the run.
  docs:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Only hypre-rs: hypre-sys's docs are bindgen output.
      - name: Build documentation
        run: |
          cargo doc --no-deps --all-features -p hypre-rs
          # cargo doc has no top-level index: send the site root to the crate.
          echo '<meta http-equiv="refresh" content="0; url=hypre_rs/index.html">' > target/doc/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: target/doc
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: target/doc

  # Publishes the documentation built by `docs` to GitHub Pages, on pushes to
  # master only. Needs Settings > Pages > Source set to "GitHub Actions".
  pages:
    needs: [docs, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push does not cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
